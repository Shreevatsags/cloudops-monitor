apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudops-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cloudops-app

  template:
    metadata:
      labels:
        app: cloudops-app

    spec:

      serviceAccountName: cloudops-backend
      
      containers:
        - name: cloudops-app

          image: 789288815883.dkr.ecr.us-east-1.amazonaws.com/cloudops-app:jenkins-4

          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres-service:5432/cloudops_monitor"

            - name: JWT_SECRET_KEY
              value: "change-this-secret"

            - name: JWT_ALGORITHM
              value: "HS256"

            - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
              value: "60"