services:

  postgres:
    image: postgres:16
    container_name: cloudops-postgres

    environment:
      POSTGRES_DB: cloudops_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d cloudops_monitor"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: cloudops-backend

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cloudops_monitor
      JWT_SECRET_KEY: change-this-secret
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60

    ports:
      - "8000:8000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: cloudops-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:

  postgres_data: